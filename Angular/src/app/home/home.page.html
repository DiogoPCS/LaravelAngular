<ion-content [fullscreen]="true">

    <div>
        {{ this.titulo }}
    </div>
    <ng-container *ngFor="let aluno of this.alunos">
        <h1>{{ aluno.nome }}</h1>
        <h3>{{ aluno.email }}</h3>
    </ng-container>

    <form action="http://127.0.0.1:8000/aluno/create" method="post">
        
    </form>
    
    
</ion-content>
